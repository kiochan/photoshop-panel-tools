<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'">
  <title>Panel Tools</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <label for="language">Language / 语言</label>
  <select id="language"><option value="zh-CN">简体中文</option><option value="en">English</option></select>
  <h1>Panel Tools</h1>
  <p id="description">在指针旁召回面板；每槽独立选择实时镜像或移动真实浮动面板。</p>
  <p id="compatibility">兼容目标：PS 2019 及以上。目前尚未实机验证。</p>
  <p id="host" role="status">正在读取 Photoshop 版本…</p>
  <button id="launch" type="button">打开面板工具</button>
  <p id="shortcuts">默认 Alt + 1～5 召唤／放回，可自定义或分设放回键。</p>
  <p id="status" role="status">解压完整安装包后，打开工具绑定面板。也可直接运行 helper/PanelMirror.exe。</p>
  <script src="panel.js"></script>
</body>
</html>
